name: slint-portable

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*-slint"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package portable
        id: package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $asset = "Decro.Slint_${version}_portable_x64.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/decro-slint.exe "dist/Decro Slint.exe" -Force
          Copy-Item README.md "dist/README.md" -Force
          Compress-Archive -Path "dist/*" -DestinationPath $asset -Force
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset" | Set-Content -Path sha256.txt -Encoding ascii
          "version=$version" >> $env:GITHUB_OUTPUT
          "asset=$asset" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: decro-slint-windows
          path: |
            Decro.Slint_*_portable_x64.zip
            sha256.txt
          if-no-files-found: error

      - name: Verify tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $expected = "v${{ steps.package.outputs.version }}-slint"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version (expected $expected)"
          }

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ steps.package.outputs.version }}"
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## " + [regex]::Escape($version) + "\s*\r?\n(.*?)(?=^## |\z)"
          $match = [regex]::Match($changelog, $pattern)
          $body = if ($match.Success) { $match.Groups[1].Value.Trim() } else { "Release $version" }
          $notes = @(
            "Decro Slint $version",
            "",
            $body,
            "",
            "SHA256: ${{ steps.package.outputs.sha256 }}"
          ) -join "`n"
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.asset }}
          body_path: release-notes.md
          prerelease: true
          fail_on_unmatched_files: true
