[package]
name = "decro-slint"
version = "0.4.4"
edition = "2021"
description = "Decro Slint portable client"

[[bin]]
name = "decro-slint"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.18"
cc = "1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dependencies]
# Prefer OpenGL (femtovg) for hardware acceleration; the winit backend falls
# back to the software renderer when no usable GL context can be created.
slint = { version = "1.18", default-features = false, features = ["backend-winit", "renderer-femtovg", "renderer-software", "compat-1-2", "std", "accessibility"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "gzip", "stream", "blocking"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync", "fs", "io-util"] }
rand = "0.8"
qrcode = "0.14"
rodio = "0.20"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
windows = { version = "0.62", features = [
    "Foundation",
    "Media",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 2
panic = "abort"
strip = true
